<header class="shadow-md p-3 w-full max-h-20 fixed top-0 z-50 bg-white">
  <div class="flex align-middle items-center justify-between max-w-screen-2xl mx-auto">
    <img routerLink="/" src="/images/logo.png" alt="app logo" class="max-h-16" />
    <nav class="flex gap-3 my-2 uppercase text-2xl">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
      <a routerLink="/shop" routerLinkActive="active">Shop</a>
      <a routerLink="/test-error" routerLinkActive="active">Errors</a>
    </nav>
    <div class="flex gap-3 align-middle">
      <a
        routerLink="/cart"
        routerLinkActive="active"
        matBadge="{{ cartService.itemCount() }}"
        matBadgeSize="large"
        class="custom-badge mt-2 mr-2"
      >
        <mat-icon>shopping_cart</mat-icon>
      </a>
      @if (accountService.currentUser()) {
        <button class="user-trigger" [mat-menu-trigger-for]="menu">
          <div class="user-avatar">
            {{ accountService.currentUser()?.email?.[0]?.toUpperCase() }}
          </div>
          <mat-icon class="dropdown-icon">expand_more</mat-icon>
        </button>
      } @else {
        <button routerLink="/login" mat-stroked-button>Login</button>
        <button routerLink="/register" mat-stroked-button>Register</button>
      }
    </div>
  </div>
</header>

@if (busyService.loading) {
  <mat-progress-bar class="fixed top-20 z-50" mode="indeterminate"></mat-progress-bar>
}

<mat-menu #menu="matMenu" class="user-menu">
  <div class="menu-header" (click)="$event.stopPropagation()">
    <div class="menu-avatar">
      {{ accountService.currentUser()?.email?.[0]?.toUpperCase() }}
    </div>
    <div class="menu-user-info">
      <span class="menu-email">{{ accountService.currentUser()?.email }}</span>
      <span class="menu-role">Member</span>
    </div>
  </div>

  <mat-divider></mat-divider>

  <button mat-menu-item routerLink="/cart">
    <mat-icon>shopping_cart</mat-icon>
    <span>My Cart</span>
  </button>
  <button mat-menu-item routerLink="/orders">
    <mat-icon>receipt_long</mat-icon>
    <span>My Orders</span>
  </button>

  <mat-divider></mat-divider>

  <button mat-menu-item class="logout-item" (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Logout</span>
  </button>
</mat-menu>
