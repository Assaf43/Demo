.
<div class="flex flex-col gap-6">

  <div class="flex items-center gap-4">

    <mat-paginator
      (page)="handlePageEvent($event)"
      [length]="products?.count || 0"
      [pageSize]="shopParams.pageSize"
      [pageIndex]="shopParams.pageIndex - 1"
      [pageSizeOptions]="[5, 10, 15, 20]"
      showFirstLastButtons
      aria-label="Select Page"
      class="shrink-0"
    ></mat-paginator>

    <form
      #searchForm="ngForm"
      (ngSubmit)="onSearchChange()"
      class="relative flex items-center flex-1"
    >
      <mat-icon class="absolute left-3 text-gray-400 pointer-events-none">search</mat-icon>
      <input
        class="block w-full h-10 pl-10 pr-4 text-sm text-gray-900 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:border-transparent"
        matInput
        placeholder="Search products..."
        name="search"
        [(ngModel)]="shopParams.search"
        (input)="onSearchChange()"
      />
    </form>

    <div class="flex gap-3 shrink-0">
      <button mat-flat-button color="primary" (click)="openFilterDialog()">
        <mat-icon>filter_list</mat-icon>
        Filters
      </button>
      <button mat-flat-button color="primary" [matMenuTriggerFor]="sortMenu">
        <mat-icon>swap_vert</mat-icon>
        Sort
      </button>
    </div>

  </div>

  <div class="grid grid-cols-5 gap-4">
    @for (product of products?.data; track product.id) {
      <app-product-item class="h-full" [product]="product"></app-product-item>
    }
  </div>

</div>

<mat-menu #sortMenu="matMenu">
  <mat-selection-list [multiple]="false" (selectionChange)="onSortChange($event)">
    @for (sort of sortOptions; track $index) {
      <mat-list-option [value]="sort.value" [selected]="shopParams.sort === sort.value">
        {{ sort.name }}
      </mat-list-option>
    }
  </mat-selection-list>
</mat-menu>
