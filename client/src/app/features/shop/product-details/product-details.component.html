@if (product) {
  <section class="py-12">
    <div class="max-w-5xl mx-auto px-6">
      <div class="grid grid-cols-2 gap-16 items-start">

        <!-- Image -->
        <div class="bg-gray-50 rounded-2xl p-10 flex items-center justify-center">
          <img
            [src]="product.pictureUrl"
            alt="{{ product.name }}"
            class="w-full max-h-115 object-contain"
          />
        </div>

        <!-- Details -->
        <div class="flex flex-col gap-6 pt-4">

          <div>
            <p class="text-xs uppercase tracking-widest text-purple-600 font-semibold mb-2">Product Details</p>
            <h1 class="text-3xl font-bold text-gray-900 leading-tight">{{ product.name }}</h1>
          </div>

          <div class="flex items-baseline gap-2">
            <span class="text-4xl font-extrabold text-gray-900">{{ product.price | currency }}</span>
          </div>

          <mat-divider></mat-divider>

          <p class="text-gray-500 leading-relaxed text-sm">{{ product.description }}</p>

          <mat-divider></mat-divider>

          <div class="flex items-end gap-4">
            <div class="flex flex-col gap-1">
              <label class="text-xs text-gray-500 font-medium tracking-wide">Qty</label>
              <input
                type="number"
                min="1"
                value="1"
                class="qty-input"
              />
            </div>

            <button mat-flat-button color="primary" class="add-to-cart-btn">
              <mat-icon>shopping_cart</mat-icon>
              Add to Cart
            </button>
          </div>

        </div>
      </div>
    </div>
  </section>
}
