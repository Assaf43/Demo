<div class="container mt-5 p-4 bg-gray-100 rounded shadow-lg">
    <h1 class="text-2xl font-semibold mb-4">Server Error</h1>
    @if (error) {
        <h5>{{error.message}}</h5>
        <p>This error comes from the server, not client</p>
        <p>What to do next?</p>
        <ol class="list-decimal ml-5 mb-4">
            <li class="mb-1">Check the server logs for more information</li>
            <li class="mb-1">Verify your internet connection</li>
            <li class="mb-1">Try again later</li>
        </ol>
        <h5>Stack Trace:</h5>
        <mat-card class="mb-4 bg-white">
            <code class="block whitespace-pre-wrap">{{error.details}}</code>
        </mat-card>
    }
</div>
